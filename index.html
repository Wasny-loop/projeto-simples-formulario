<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Formulários</title>
</head>
<body>

    <h1>Exercício de Formulários</h1>

    <form action="index.html" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome:</label> <br>
            <input type="text" name="nome" id="nome">

            <br>

            <label for="email">Email:</label> <br>
            <input type="text" name="email" id="email">

            <br>

            <input type="checkbox" name="aceite" value="aceito" id="aceite">
            <label for="aceite">Quero receber por este e-mail</label> 

            <br><br>

            <label for="senha">Senha:</label> <br>
            <input type="password" name="senha" id="senha">

        </fieldset>

        <fieldset>
            <legend>Informações Adicionais</legend>

            <input type="radio" name="pessoa" value="fisica" id="fisica">
            <label for="fisica">Pessoa Física</label>

            <input type="radio" name="pessoa" value="juridica" id="juridica">
            <label for="juridica">Pessoa Jurídica</label>
            
        </fieldset>

        <br>

        <input type="submit" value="cadastrar">

    </form>


</body>
</html>
